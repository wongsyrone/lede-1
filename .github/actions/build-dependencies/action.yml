name: Build dependencies
description: Install OpenWrt bootstrap and host BPF build dependencies
runs:
  using: composite
  steps:
    - name: Free Disk Space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
        sudo docker image prune -a -f 2>/dev/null || true
        df -h /
    - name: Install Build Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev \
          file wget subversion libelf-dev swig time tree zstd
