# Public router profile; Nikki owns listeners, TUN and transparent routing.
# Add private nodes to providers/proxy/user.yaml; no proxy credentials are shipped.
---
ipv6: true
mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'
geodata-mode: false
geo-auto-update: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - "+.push.apple.com"
  - Mijia Cloud
dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - "+.lan"
  - "+.local"
  - "+.arpa"
  - localhost
  - stun.*.*.*
  - stun.*.*
  - turn.*.*.*
  - turn.*.*
  - time.windows.com
  - time.nist.gov
  - time.apple.com
  - time.asia.apple.com
  - "+.ntp.org.cn"
  - "+.pool.ntp.org"
