  - time2.google.com
  - time3.google.com
  - time4.google.com
  - time.cloudflare.com
  - "+.music.163.com"
  - "+.126.net"
  - musicapi.taihe.com
  - music.taihe.com
  - songsearch.kugou.com
  - trackercdn.kugou.com
  - "+.kuwo.cn"
  - api-jooxtt.sanook.com
  - api.joox.com
  - joox.com
  - "+.y.qq.com"
  - streamoc.music.tc.qq.com
  - mobileoc.music.tc.qq.com
  - isure.stream.qqmusic.qq.com
  - dl.stream.qqmusic.qq.com
  - aqqmusic.tc.qq.com
  - amobile.music.tc.qq.com
  - "+.xiami.com"
  - "+.music.migu.cn"
  - "+.msftconnecttest.com"
  - "+.msftncsi.com"
  - localhost.ptlogin2.qq.com
  - detectportal.firefox.com
  - connectivitycheck.gstatic.com
  - captive.apple.com
  - "*.*.*.srv.nintendo.net"
  - "*.*.stun.playstation.net"
  - xbox.*.*.microsoft.com
  - "*.ipv6.microsoft.com"
  - "*.*.xboxlive.com"
  - speedtest.cros.wr.pvp.net
  - debian.map.fastlydns.net
  - "*.*.*.*.*.3gppnetwork.org"
  - "*.*.*.*.*.*.3gppnetwork.org"
  proxy-server-nameserver: &1
  - 180.76.76.76
  - https://dns.pub/dns-query
  - https://doh.360.cn/dns-query
  - tls://dot.360.cn:853
  default-nameserver:
  - 180.76.76.76
  - 119.29.29.29
  nameserver-policy:
    rule-set:gfw,greatfire:
    - https://1.1.1.1/dns-query#dns-out
    - https://8.8.8.8/dns-query#dns-out
    ? rule-set:geosite-private,cn,geolocation-cn,category-cdn-cn,category-httpdns-cn,apple-cn,icloud-cn,microsoft-cn,steam-cn,category-games-cn
    : *1
    "+.music.163.com,+.126.net,+.kuwo.cn,+.kugou.com,+.taihe.com,+.migu.cn,+.xiami.com": *1
    debian.map.fastlydns.net: *1
    "+.lan,+.local,+.in-addr.arpa,+.ip6.arpa":
    - 127.0.0.1:53
  nameserver: *1
  direct-nameserver: *1
  direct-nameserver-follow-policy: true
  listen: "[::]:1053"
proxies: []
proxy-providers:
  user:
    type: file
    path: "/etc/nikki/run/providers/proxy/user.yaml"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: dns-out
  type: select
  proxies:
  - dns-auto
  - DIRECT
- name: dns-auto
  type: fallback
  include-all-providers: true
  exclude-filter: 剩|重置|到期|无法|更新|高倍率|域名
